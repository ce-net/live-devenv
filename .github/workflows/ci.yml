name: ci
on: [push, pull_request]
jobs:
  build-test-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: build every crate
        run: cargo build --workspace --release --locked
      - name: generated contract (for comparison)
        run: mkdir -p ci-proof && target/release/ws-node contract > ci-proof/contract.json && cp Cargo.lock ci-proof/
      - name: unit, replica and sandbox tests; the generated contract matches the committed one
        run: |
          cargo test --workspace --release --locked -- --nocapture 2>&1 | tee ci-test.log | grep -E "test result|panicked|FAILED"
          ! grep -q "test result: FAILED" ci-test.log
      - name: what the box can give on this runner
        run: sysctl kernel.apparmor_restrict_unprivileged_userns || true
      - name: the 14-step proof on the in-process mesh, with real boxed builds on the worker
        # GitHub's runners refuse unprivileged user namespaces (AppArmor), so the workspace minimum there is
        # landlock+seccomp; on the fleet nodes it is ns+landlock+seccomp.
        run: |
          if unshare -Ur true 2>/dev/null; then export WS_MIN_CLASS=ns+landlock+seccomp; else export WS_MIN_CLASS=landlock+seccomp; fi
          target/release/ws-node proof --net sim --out ci-proof
          target/release/ws-node verify ci-proof/sim.json
      - name: the page's WebAssembly builds
        run: cargo build -p ws-wasm --target wasm32-unknown-unknown --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-proof
          path: ci-proof

  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: static ws-node for x86_64 and aarch64 Linux
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo build --release --locked -p ws-node --target x86_64-unknown-linux-musl
          cargo build --release --locked -p ws-node --target aarch64-unknown-linux-musl
          mkdir -p bin && cp target/x86_64-unknown-linux-musl/release/ws-node bin/ws-node-x86_64 && cp target/aarch64-unknown-linux-musl/release/ws-node bin/ws-node-aarch64
          sha256sum bin/*
      - uses: actions/upload-artifact@v4
        with:
          name: ws-node
          path: bin

  site:
    # the page a deployed node serves (ws-node serve with "site"): the same files as the Pages build, with the
    # WebAssembly, as one tarball and its sha256 (HANDOFF.md names both)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: page with its WebAssembly
        run: |
          cargo build -p ws-wasm --target wasm32-unknown-unknown --release --locked
          curl -sSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz | tar xz
          ./wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen --target web --no-typescript --out-dir site/pkg target/wasm32-unknown-unknown/release/ws_wasm.wasm
          mkdir -p out && tar -C site -czf out/ws-site.tar.gz . && sha256sum out/ws-site.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ws-site
          path: out
